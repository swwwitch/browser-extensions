<!DOCTYPE html>
<html lang="ja">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'">

    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

    <link rel="stylesheet" href="../Style.css">
    <script src="../Script.js" defer></script>
</head>
<body>
    <img src="../Icon.png" width="128" height="128" alt="Page Navigator Icon">
    <p class="state-unknown">Safariの設定の「機能拡張」で、Page Navigator をオンにしてください。</p>
    <p class="state-on">Page Navigator はオンです。Safariの設定の「機能拡張」でオフにできます。</p>
    <p class="state-off">Page Navigator はオフです。Safariの設定の「機能拡張」でオンにしてください。</p>
    <button class="open-preferences">終了して、Safariの機能拡張の設定を開く</button>
</body>
</html>
