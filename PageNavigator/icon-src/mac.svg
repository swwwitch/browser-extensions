<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- macOS のアプリのアイコン（App Store・Safari のアプリ用）。1024 の中に 824 の角丸の四角、影つき（Apple の macOS アイコンのグリッド） -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5599d5"/><stop offset="1" stop-color="#8a3961"/></linearGradient>
    <filter id="s" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="1.6" stdDeviation="1.9" flood-color="#000" flood-opacity=".28"/></filter>
  </defs>
  <g transform="translate(100 100) scale(6.4375)">
    <rect width="128" height="128" rx="28.7" fill="url(#g)" filter="url(#s)"/>
    <g fill="#fff"><rect x="21" y="31" width="46" height="11"/><rect x="21" y="56" width="33" height="11"/><rect x="21" y="82" width="46" height="11"/></g>
    <rect x="88" y="29" width="14" height="71" fill="none" stroke="#fff" stroke-width="6"/>
  </g>
</svg>
