<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Page Navigator</title>
<style>
  body{margin:0;width:300px;font:13px/1.6 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Segoe UI",sans-serif;color:#182b3c;background:#fff}
  header{padding:12px 16px;border-bottom:1px solid #dce4e9;font-weight:700;font-size:14px}
  section{padding:10px 16px}
  section+section{border-top:1px solid #eef2f5}
  label{display:flex;align-items:flex-start;gap:8px;padding:5px 0;cursor:pointer}
  input{margin:3px 0 0}
  small{display:block;color:#5c6c78;font-size:11px}
  kbd{font:inherit;font-size:11px;padding:0 4px;border:1px solid #cfd8df;border-radius:4px;background:#f5f7f9}
  .host{font-weight:700;word-break:break-all}
  @media (prefers-color-scheme: dark){body{background:#1f262c;color:#e8eef3}header,section+section{border-color:#34424e}small{color:#9fb0bd}kbd{background:#2a333b;border-color:#45525d}}
</style>
</head>
<body>
<header>Page Navigator</header>
<section>
  <label><input type="checkbox" data-key="rail"><span>エレベーター<small>左端に見出しの目盛り。押すとその見出しへ</small></span></label>
  <label><input type="checkbox" data-key="minimap"><span>ミニマップ<small>右端にマウスを寄せると、ページ全体の縮図</small></span></label>
  <label><input type="checkbox" data-key="edge"><span>上下の帯<small>画面の上端・下端にマウスを寄せると、先頭・末尾へ</small></span></label>
  <label><input type="checkbox" data-key="jump"><span>見出しのジャンプ<small id="combo"></small></span></label>
  <label><input type="checkbox" data-key="jk"><span><kbd>J</kbd> / <kbd>K</kbd> でもジャンプ<small>Gmail・X など、J・K を使うサイトでは切にしてください</small></span></label>
</section>
<section>
  <label><input type="checkbox" id="site"><span>このサイトでは使わない<small class="host" id="host"></small></span></label>
</section>
<script src="popup.js"></script>
</body>
</html>
